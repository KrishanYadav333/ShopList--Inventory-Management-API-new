name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # npm 10 has a peer-dependency resolver bug with vitest, hence --legacy-peer-deps
      - run: npm ci --legacy-peer-deps
      - name: Build the web app (the Worker's static assets directory must exist for tests)
        run: npm run build -w @shoplist/web
      - name: Generate Worker types (the file is not committed)
        run: npm run types -w @shoplist/api
      - name: Typecheck
        run: |
          npm run typecheck -w @shoplist/api
          npm run typecheck -w @shoplist/web
      - name: Tests (inside the Workers runtime)
        run: npm test
      - name: Bundle size budget (initial 150 KB, each lazy chunk 60 KB, gzipped)
        run: |
          fail=0
          for f in apps/web/dist/assets/*.js; do
            size=$(gzip -9c "$f" | wc -c)
            case "$f" in */index-*) limit=153600 ;; *) limit=61440 ;; esac
            echo "$f: $size bytes (limit $limit)"
            test "$size" -le "$limit" || fail=1
          done
          exit $fail
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
