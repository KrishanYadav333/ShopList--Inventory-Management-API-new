<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopList - Inventory Management</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/inventory.css">
</head>
<body>
    <header class="app-header">
        <div class="container header-inner">
            <div class="brand"><i class="fas fa-boxes-stacked"></i> ShopList</div>
            <p class="tagline">Inventory management</p>
        </div>
    </header>

    <main class="container">
        <section class="stats" aria-label="Inventory overview">
            <div class="stat-card">
                <i class="fas fa-box"></i>
                <div><div class="stat-value" id="totalProducts">0</div><div class="stat-label">Products</div></div>
            </div>
            <div class="stat-card">
                <i class="fas fa-dollar-sign"></i>
                <div><div class="stat-value" id="totalValue">$0.00</div><div class="stat-label">Inventory value</div></div>
            </div>
            <div class="stat-card">
                <i class="fas fa-triangle-exclamation"></i>
                <div><div class="stat-value" id="lowStock">0</div><div class="stat-label">Low stock (&lt; 10)</div></div>
            </div>
        </section>

        <section class="panel">
            <h2><i class="fas fa-plus-circle"></i> Add product</h2>
            <form id="productForm" class="form-grid">
                <label>Name *
                    <input type="text" name="name" maxlength="100" required placeholder="e.g. Wireless Mouse">
                </label>
                <label>SKU *
                    <input type="text" name="sku" maxlength="50" required placeholder="e.g. MOUSE-001">
                </label>
                <label>Price ($) *
                    <input type="number" name="price" min="0" step="0.01" required placeholder="0.00">
                </label>
                <label>Quantity *
                    <input type="number" name="quantity" min="0" step="1" required placeholder="0">
                </label>
                <label class="span-2">Description
                    <textarea name="description" maxlength="500" rows="2" placeholder="Optional"></textarea>
                </label>
                <div class="span-2"><button type="submit" class="btn-primary"><i class="fas fa-plus"></i> Add product</button></div>
            </form>
        </section>

        <section class="panel">
            <div class="list-head">
                <h2><i class="fas fa-list"></i> Inventory</h2>
                <div class="search-box">
                    <input type="search" id="searchInput" placeholder="Search by name or SKU (Ctrl+K)" aria-label="Search products">
                    <button type="button" id="searchBtn" class="btn-primary" aria-label="Search"><i class="fas fa-search"></i></button>
                </div>
            </div>
            <div id="productsContainer"></div>
        </section>
    </main>

    <div id="editModal" class="modal" role="dialog" aria-modal="true" aria-label="Edit product">
        <div class="modal-content">
            <span class="close" role="button" aria-label="Close" tabindex="0">&times;</span>
            <h2><i class="fas fa-edit"></i> Edit product</h2>
            <form id="editForm" class="form-grid">
                <input type="hidden" id="editProductId">
                <label>Name *
                    <input type="text" id="editProductName" maxlength="100" required>
                </label>
                <label>SKU *
                    <input type="text" id="editProductSku" maxlength="50" required>
                </label>
                <label>Price ($) *
                    <input type="number" id="editProductPrice" min="0" step="0.01" required>
                </label>
                <label>Quantity *
                    <input type="number" id="editProductQuantity" min="0" step="1" required>
                </label>
                <label class="span-2">Description
                    <textarea id="editProductDescription" maxlength="500" rows="2"></textarea>
                </label>
                <div class="span-2"><button type="submit" class="btn-primary"><i class="fas fa-save"></i> Save changes</button></div>
            </form>
        </div>
    </div>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
